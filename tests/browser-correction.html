<!doctype html><meta charset="utf-8"><title>書影補正の検証</title>
<h1>書影補正の検証（空の専用ローカル環境）</h1><pre id="result">実行中…</pre>
<button id="inspect" hidden>補正画面を確認</button>
<iframe id="app" src="../index.html" style="width:390px;height:760px"></iframe>
<script>
(async()=>{
  const output=document.getElementById('result'),frame=document.getElementById('app');
  const wait=async fn=>{for(let i=0;i<600;i++){if(fn())return;await new Promise(r=>setTimeout(r,25));}throw Error('タイムアウト');};
  const ok=(value,message)=>{if(!value)throw Error(message);output.textContent+='\nPASS '+message;};
  try{
    await wait(()=>{try{return frame.contentWindow.eval('typeof BookCorrection')!=='undefined';}catch{return false;}});
    const w=frame.contentWindow,d=w.document;
    if(w.localStorage.getItem('my-bookshelf-v1')!==null)throw Error('既存書籍があるため停止しました。新しいポートで実行してください。');
    const consent=w.localStorage.getItem('my-bookshelf-terms');
    if(!w.eval('Terms.allowed()')){d.getElementById('termsCheck').checked=true;d.getElementById('termsCheck').dispatchEvent(new Event('change'));d.getElementById('acceptTerms').click();}
    const codec=w.eval('ImageCodec'),images=w.eval('BookImages'),backup=w.eval('BookBackup'),correction=w.eval('BookCorrection');
    const canvas=document.createElement('canvas');canvas.width=600;canvas.height=800;
    const ctx=canvas.getContext('2d');ctx.fillStyle='#222';ctx.fillRect(0,0,600,800);
    ctx.fillStyle='#f7eaca';ctx.beginPath();ctx.moveTo(100,100);ctx.lineTo(500,160);ctx.lineTo(460,700);ctx.lineTo(130,660);ctx.closePath();ctx.fill();
    ctx.fillStyle='#314460';ctx.font='bold 45px sans-serif';ctx.fillText('MY BOOK',155,320);ctx.fillStyle='#c45b4d';ctx.fillRect(175,400,210,160);
    const blob=await new Promise(resolve=>canvas.toBlob(resolve,'image/jpeg',.95)),file=new File([blob],'cover.jpg',{type:'image/jpeg'});
    const choose=(id,value)=>{const transfer=new w.DataTransfer();transfer.items.add(value);d.getElementById(id).files=transfer.files;d.getElementById(id).dispatchEvent(new Event('change'));};
    d.getElementById('addBookBtn').click();d.getElementById('title').value='補正テスト';choose('fileCoverInput',file);await wait(()=>!w.eval('covers.loading()'));
    ok(!d.getElementById('correctCover').hidden&&!d.getElementById('coverCorrectionDialog').open,'ファイル選択は自動加工しない');
    const pendingId=w.eval('covers.id()');d.getElementById('correctCover').click();
    await wait(()=>d.getElementById('coverCorrectionDialog').open);
    ok(d.getElementById('correctionRetake').hidden,'ファイル画像の補正は明示操作から開始');
    d.getElementById('correctionCancel').click();await wait(()=>!w.eval('covers.loading()'));
    ok(w.eval('covers.id()')===pendingId,'ファイル補正キャンセルで選択画像を保持');
    d.getElementById('bookForm').requestSubmit();await wait(()=>!d.getElementById('bookDialog').open);
    const oldId=JSON.parse(w.localStorage.getItem('my-bookshelf-v1'))[0].coverId;
    d.querySelector('.card-hit').click();choose('cameraCoverInput',file);
    await wait(()=>d.getElementById('coverCorrectionDialog').open&&!d.getElementById('correctionUse').disabled);
    ok(true,'撮影後に自動検出・補正候補');
    d.getElementById('correctionCancel').click();await wait(()=>!w.eval('covers.loading()'));
    ok(w.eval('covers.id()')===oldId&&w.eval('covers.records().length')===0&&!d.getElementById('coverPreview').hidden,'候補のキャンセルで既存書影とプレビューを維持');
    choose('cameraCoverInput',file);await wait(()=>d.getElementById('coverCorrectionDialog').open);
    d.getElementById('correctionOriginal').click();await wait(()=>!w.eval('covers.loading()'));
    const original=await codec.fromFile(file),adopted=w.eval('covers.records()[0].blob');
    ok(new Uint8Array(await adopted.arrayBuffer()).every((byte,i)=>byte===original.bytes[i])&&adopted.size===original.blob.size,'処理中の補正なし採用で元画素を保持');
    choose('cameraCoverInput',file);await wait(()=>!d.getElementById('correctionUse').disabled);
    d.getElementById('correctionAdjust').click();
    ok(d.getElementById('correctionUse').disabled,'四隅調整中は旧プレビューを採用不可');
    const corner=d.querySelector('[data-corner="0"]');corner.dispatchEvent(new KeyboardEvent('keydown',{key:'ArrowRight',bubbles:true}));
    d.getElementById('correctionRatio').value='0.5';d.getElementById('correctionRatio').dispatchEvent(new Event('input'));d.getElementById('correctionRender').click();
    await wait(()=>!d.getElementById('correctionUse').disabled);
    const preview=d.getElementById('correctionPreview');await preview.decode();
    ok(Math.abs(preview.naturalWidth/preview.naturalHeight-.5)<.005,'手動の四隅・縦横比変更を反映');
    const shown=document.createElement('img');shown.alt='補正後の検証画像';shown.src=preview.src;shown.style.maxHeight='400px';
    // Keep an independent preview URL only for this test page's visual inspection.
    const shownBlob=await (await fetch(preview.src)).blob();shown.src=URL.createObjectURL(shownBlob);document.body.appendChild(shown);
    d.getElementById('correctionUse').click();await wait(()=>!w.eval('covers.loading()'));
    const selected=w.eval('covers.records()[0]');
    ok(selected.blob.type==='image/jpeg'&&codec.sanitize(await selected.blob.arrayBuffer()).orientation===null,'補正JPEGに二重回転のExifなし');
    ok(w.eval('covers.records().length')===1&&d.getElementById('correctCover').hidden,'採用した1画像だけ保持・再補正なし');
    d.getElementById('bookForm').requestSubmit();await wait(()=>!d.getElementById('bookDialog').open);
    const books=JSON.parse(w.localStorage.getItem('my-bookshelf-v1'));
    ok(!(await images.get(oldId))&&!!(await images.get(books[0].coverId)),'保存後は採用画像だけをIndexedDBに保持');
    const zip=await backup.exportZip(books),restored=await backup.importFile(zip.blob);
    ok(restored.records.length===1&&restored.records[0].blob.size===selected.blob.size,'ZIPも補正済み1画像のみ');
    // Uniform photos must fall back to manual corners, not confidently crop.
    ctx.fillStyle='#fff';ctx.fillRect(0,0,600,800);const blank=await codec.fromFile(await new Promise(resolve=>canvas.toBlob(resolve,'image/png')));
    const opened=correction.open(blank);await wait(()=>!d.getElementById('correctionEdit').hidden);
    ok(d.getElementById('correctionUse').disabled,'検出困難な画像は手動調整へ');
    d.getElementById('correctionCancel').click();ok(await opened===null,'未確定画像を破棄');
    const NativeWorker=w.Worker;w.Worker=class{constructor(){throw Error('unsupported');}};
    const unsupported=correction.open(original);ok(d.getElementById('correctionStatus').textContent.includes('利用できません'),'Worker起動失敗時の案内');
    d.getElementById('correctionOriginal').click();ok((await unsupported).blob===original.blob,'補正不能でも未加工で登録可能');w.Worker=NativeWorker;
    const nativeTimer=w.setTimeout;let terminated=0;
    w.Worker=class{postMessage(){}terminate(){terminated++;}};
    w.setTimeout=(fn,delay,...args)=>nativeTimer(fn,delay===30000?20:delay,...args);
    const timed=correction.open(original);await wait(()=>d.getElementById('correctionStatus').textContent.includes('処理時間'));
    ok(terminated>0,'時間超過時にWorkerを停止');d.getElementById('correctionOriginal').click();await timed;
    w.Worker=NativeWorker;w.setTimeout=nativeTimer;
    const canceled=correction.open(original);correction.cancel();ok(await canceled===null,'検出中の中止');
    const raw=new Uint8Array(await blob.arrayBuffer()),exif=new Uint8Array([255,225,0,34,69,120,105,102,0,0,73,73,42,0,8,0,0,0,1,0,18,1,3,0,1,0,0,0,6,0,0,0,0,0,0,0]);
    const oriented=await codec.fromFile(new Blob([raw.slice(0,2),exif,raw.slice(2)],{type:'image/jpeg'}));
    const orientedOpen=correction.open(oriented);
    await wait(()=>d.getElementById('correctionSource').getAttribute('href'));
    const sourceImage=new Image();sourceImage.src=d.getElementById('correctionSource').getAttribute('href');await sourceImage.decode();
    ok(sourceImage.naturalWidth===oriented.width&&sourceImage.naturalHeight===oriented.height,'向き6の写真をWorkerでも正しい縦横で処理');
    correction.cancel();await orientedOpen;
    await w.navigator.locks.request('my-bookshelf-v1',async()=>{w.localStorage.removeItem('my-bookshelf-v1');await images.collect([]);});
    if(consent===null)w.localStorage.removeItem('my-bookshelf-terms');
    w.eval('refreshBooks()');frame.hidden=true;output.textContent+='\nALL PASS（テストデータを削除済み）';
    document.getElementById('inspect').hidden=false;
    document.getElementById('inspect').onclick=()=>{frame.hidden=false;d.getElementById('addBookBtn').click();choose('cameraCoverInput',file);};
  }catch(error){output.textContent+='\nFAIL '+error.stack;}
})();
</script>
