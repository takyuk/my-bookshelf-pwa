<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#111827" />
  <meta name="description" content="自宅の蔵書と読書履歴を管理する個人用本棚アプリ" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="本棚" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="apple-touch-icon" href="./icons/icon-192.png" />
  <title>My Bookshelf</title>
    <style>
:root{
  font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  color:#111827; background:#f5f7fb;
  --ink:#111827; --muted:#6b7280; --line:#e5e7eb; --panel:#ffffff; --accent:#111827;
}
*{box-sizing:border-box} body{margin:0;min-height:100vh;background:linear-gradient(180deg,#eef2f7 0,#f8fafc 260px)}
button,input,select,textarea{font:inherit}.topbar{max-width:1180px;margin:0 auto;padding:28px 20px 14px;display:flex;gap:18px;justify-content:space-between;align-items:end}
.eyebrow{margin:0 0 4px;text-transform:uppercase;letter-spacing:.16em;font-size:.72rem;color:var(--muted);font-weight:700}.topbar h1{margin:0;font-size:clamp(1.8rem,5vw,2.7rem);letter-spacing:-.04em}
.container{max-width:1180px;margin:0 auto;padding:12px 20px 60px}.primary,.ghost,.danger,.file-label{border-radius:12px;padding:11px 16px;border:1px solid transparent;cursor:pointer;font-weight:700;white-space:nowrap}.primary{background:var(--accent);color:white}.ghost,.file-label{background:white;border-color:var(--line);color:var(--ink)}.danger{background:#fff1f2;color:#be123c;border-color:#fecdd3}.hidden{display:none!important}.install-row{max-width:1180px;margin:0 auto;padding:0 20px 8px;display:flex;justify-content:flex-end}.install-note{max-width:1180px;margin:0 auto 10px;padding:10px 20px;color:var(--muted);font-size:.82rem}.install-note strong{color:var(--ink)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:6px 0 22px}.stats article{background:rgba(255,255,255,.92);border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:0 8px 28px rgba(15,23,42,.05)}.stats span{display:block;font-size:1.8rem;font-weight:800}.stats small{color:var(--muted)}
.toolbar{display:grid;grid-template-columns:1fr 160px 160px;gap:10px;margin-bottom:22px}.toolbar input,.toolbar select,.form-grid input,.form-grid select,.form-grid textarea{width:100%;border:1px solid #d1d5db;border-radius:12px;background:#fff;padding:11px 12px;outline:none}.toolbar input:focus,.toolbar select:focus,.form-grid input:focus,.form-grid select:focus,.form-grid textarea:focus{border-color:#64748b;box-shadow:0 0 0 3px rgba(100,116,139,.12)}
.section-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}.section-head h2{margin:0;font-size:1.15rem}.actions-inline{display:flex;gap:8px}.file-label{display:inline-flex;align-items:center}
.book-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}.book-card{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:14px;display:grid;grid-template-columns:72px 1fr;gap:14px;min-height:150px;box-shadow:0 6px 18px rgba(15,23,42,.04);transition:.16s ease}.book-card:hover{transform:translateY(-2px);box-shadow:0 10px 28px rgba(15,23,42,.08)}.card-hit{position:absolute;inset:0;border:0;background:transparent;cursor:pointer;border-radius:18px}.cover{width:72px;height:104px;border-radius:8px;background:linear-gradient(145deg,#1f2937,#475569);color:#fff;display:grid;place-items:center;box-shadow:inset -7px 0 12px rgba(0,0,0,.18)}.cover span{font-size:.72rem;letter-spacing:.18em;writing-mode:vertical-rl}.book-info{min-width:0}.status-row{display:flex;justify-content:space-between;gap:8px;align-items:center}.status-badge{font-size:.72rem;background:#eef2ff;border-radius:999px;padding:3px 8px;font-weight:700}.rating{font-size:.8rem;color:#9a6700}.book-title{font-size:1rem;margin:8px 0 3px;line-height:1.35}.book-author{margin:0;color:var(--muted);font-size:.88rem}.tag-list{display:flex;flex-wrap:wrap;gap:5px;margin-top:9px}.tag{font-size:.7rem;padding:2px 7px;border-radius:999px;background:#f3f4f6;color:#4b5563}.book-meta{margin:9px 0 0;color:#9ca3af;font-size:.72rem}.empty{text-align:center;color:var(--muted);padding:44px 10px}
dialog{border:0;border-radius:20px;width:min(760px,calc(100vw - 24px));max-height:92vh;padding:0;box-shadow:0 25px 80px rgba(0,0,0,.28)}dialog::backdrop{background:rgba(15,23,42,.55);backdrop-filter:blur(3px)}#bookForm{padding:22px}.dialog-head{display:flex;justify-content:space-between;align-items:start;margin-bottom:16px}.dialog-head h2{margin:0}.icon-btn{border:0;background:#f3f4f6;border-radius:10px;width:38px;height:38px;font-size:1.4rem;cursor:pointer}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:13px}.form-grid label{display:grid;gap:6px;font-size:.84rem;font-weight:700;color:#374151}.span-2{grid-column:1/-1}.dialog-actions{display:flex;gap:10px;align-items:center;margin-top:20px}.spacer{flex:1}
@media (max-width:720px){.topbar{align-items:center}.topbar .primary{padding:10px 12px}.stats{grid-template-columns:repeat(2,1fr)}.toolbar{grid-template-columns:1fr 1fr}.toolbar input{grid-column:1/-1}.book-grid{grid-template-columns:1fr}.form-grid{grid-template-columns:1fr}.span-2{grid-column:auto}.dialog-actions{position:sticky;bottom:-22px;background:white;padding:14px 0 0}.container{padding-bottom:80px}}

</style>
</head>
<body>
  <header class="topbar">
    <div>
      <p class="eyebrow">Personal Library</p>
      <h1>My Bookshelf</h1>
    </div>
    <button id="addBookBtn" class="primary">＋ 本を追加</button>
  </header>
  <div class="install-row"><button id="installBtn" class="ghost hidden">ホーム画面に追加</button></div>
  <div id="installNote" class="install-note hidden"></div>

  <main class="container">
    <section class="stats" aria-label="蔵書サマリー">
      <article><span id="statTotal">0</span><small>蔵書</small></article>
      <article><span id="statUnread">0</span><small>未読</small></article>
      <article><span id="statReading">0</span><small>読書中</small></article>
      <article><span id="statFinished">0</span><small>今年読了</small></article>
    </section>

    <section class="toolbar">
      <input id="searchInput" type="search" placeholder="タイトル・著者・ISBN・タグで検索" />
      <select id="statusFilter">
        <option value="all">すべて</option>
        <option value="unread">未読</option>
        <option value="reading">読書中</option>
        <option value="finished">読了</option>
        <option value="paused">中断</option>
      </select>
      <select id="sortSelect">
        <option value="updated_desc">更新順</option>
        <option value="title_asc">タイトル順</option>
        <option value="author_asc">著者順</option>
        <option value="finished_desc">読了日順</option>
      </select>
    </section>

    <section class="section-head">
      <h2>本棚</h2>
      <div class="actions-inline">
        <button id="exportBtn" class="ghost">書き出し</button>
        <label class="ghost file-label">読み込み<input id="importInput" type="file" accept="application/json" hidden /></label>
      </div>
    </section>

    <section id="bookGrid" class="book-grid" aria-live="polite"></section>
    <p id="emptyState" class="empty">本がまだありません。「本を追加」から登録してください。</p>
  </main>

  <dialog id="bookDialog">
    <form id="bookForm" method="dialog">
      <div class="dialog-head">
        <div>
          <p class="eyebrow">Book</p>
          <h2 id="dialogTitle">本を追加</h2>
        </div>
        <button type="button" id="closeDialogBtn" class="icon-btn" aria-label="閉じる">×</button>
      </div>

      <input id="bookId" type="hidden" />
      <div class="form-grid">
        <label>タイトル *<input id="title" required /></label>
        <label>著者<input id="author" /></label>
        <label>ISBN<input id="isbn" inputmode="numeric" /></label>
        <label>出版社<input id="publisher" /></label>
        <label>刊行日<input id="publishedDate" type="date" /></label>
        <label>購入日<input id="purchaseDate" type="date" /></label>
        <label>購入価格（円）<input id="price" type="number" min="0" step="1" /></label>
        <label>形式
          <select id="format"><option>紙</option><option>電子書籍</option><option>その他</option></select>
        </label>
        <label>保管場所<input id="location" placeholder="例：書斎・本棚A" /></label>
        <label>状態
          <select id="status"><option value="unread">未読</option><option value="reading">読書中</option><option value="finished">読了</option><option value="paused">中断</option></select>
        </label>
        <label>読書開始日<input id="startedDate" type="date" /></label>
        <label>読了日<input id="finishedDate" type="date" /></label>
        <label>評価
          <select id="rating"><option value="0">未評価</option><option value="1">★</option><option value="2">★★</option><option value="3">★★★</option><option value="4">★★★★</option><option value="5">★★★★★</option></select>
        </label>
        <label class="span-2">タグ<input id="tags" placeholder="小説, 歴史, 仕事 など（カンマ区切り）" /></label>
        <label class="span-2">感想・メモ<textarea id="notes" rows="5"></textarea></label>
      </div>

      <div class="dialog-actions">
        <button type="button" id="deleteBtn" class="danger hidden">削除</button>
        <div class="spacer"></div>
        <button type="button" id="cancelBtn" class="ghost">キャンセル</button>
        <button type="submit" class="primary">保存</button>
      </div>
    </form>
  </dialog>

  <template id="bookCardTemplate">
    <article class="book-card">
      <button class="card-hit" type="button" aria-label="書籍を編集"></button>
      <div class="cover" aria-hidden="true"><span>BOOK</span></div>
      <div class="book-info">
        <div class="status-row"><span class="status-badge"></span><span class="rating"></span></div>
        <h3 class="book-title"></h3>
        <p class="book-author"></p>
        <div class="tag-list"></div>
        <p class="book-meta"></p>
      </div>
    </article>
  </template>

  <script>
const STORAGE_KEY = 'my-bookshelf-v1';
const statusLabels = { unread:'未読', reading:'読書中', finished:'読了', paused:'中断' };
let books = loadBooks();

const $ = (id) => document.getElementById(id);
const grid = $('bookGrid');
const empty = $('emptyState');
const dialog = $('bookDialog');
const form = $('bookForm');

function loadBooks(){
  try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || []; }
  catch { return []; }
}
function saveBooks(){ localStorage.setItem(STORAGE_KEY, JSON.stringify(books)); }
function uid(){ return crypto.randomUUID ? crypto.randomUUID() : `${Date.now()}-${Math.random()}`; }
function esc(s=''){ return s.replace(/[&<>'"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c])); }

function currentYearFinished(book){
  if(book.status !== 'finished' || !book.finishedDate) return false;
  return new Date(book.finishedDate).getFullYear() === new Date().getFullYear();
}
function renderStats(){
  $('statTotal').textContent = books.length;
  $('statUnread').textContent = books.filter(b=>b.status==='unread').length;
  $('statReading').textContent = books.filter(b=>b.status==='reading').length;
  $('statFinished').textContent = books.filter(currentYearFinished).length;
}
function filteredBooks(){
  const q = $('searchInput').value.trim().toLowerCase();
  const status = $('statusFilter').value;
  let list = books.filter(b => {
    const hay = [b.title,b.author,b.isbn,b.publisher,b.location,(b.tags||[]).join(' ')].join(' ').toLowerCase();
    return (!q || hay.includes(q)) && (status==='all' || b.status===status);
  });
  switch($('sortSelect').value){
    case 'title_asc': list.sort((a,b)=>a.title.localeCompare(b.title,'ja')); break;
    case 'author_asc': list.sort((a,b)=>(a.author||'').localeCompare(b.author||'','ja')); break;
    case 'finished_desc': list.sort((a,b)=>(b.finishedDate||'').localeCompare(a.finishedDate||'')); break;
    default: list.sort((a,b)=>(b.updatedAt||'').localeCompare(a.updatedAt||''));
  }
  return list;
}
function render(){
  renderStats(); grid.innerHTML='';
  const list = filteredBooks();
  empty.hidden = list.length > 0;
  for(const b of list){
    const node = $('bookCardTemplate').content.firstElementChild.cloneNode(true);
    node.querySelector('.status-badge').textContent = statusLabels[b.status] || '';
    node.querySelector('.rating').textContent = Number(b.rating) ? '★'.repeat(Number(b.rating)) : '';
    node.querySelector('.book-title').textContent = b.title;
    node.querySelector('.book-author').textContent = b.author || '著者未登録';
    const tags = node.querySelector('.tag-list');
    (b.tags||[]).slice(0,4).forEach(t=>{ const s=document.createElement('span'); s.className='tag'; s.textContent=t; tags.appendChild(s); });
    const meta = [b.format,b.location,b.finishedDate ? `読了 ${b.finishedDate}` : ''].filter(Boolean).join(' ・ ');
    node.querySelector('.book-meta').textContent = meta;
    node.querySelector('.card-hit').addEventListener('click',()=>openDialog(b.id));
    grid.appendChild(node);
  }
}

function resetForm(){ form.reset(); $('bookId').value=''; $('status').value='unread'; $('format').value='紙'; $('rating').value='0'; }
function openDialog(id=null){
  resetForm();
  const editing = id ? books.find(b=>b.id===id) : null;
  $('dialogTitle').textContent = editing ? '本を編集' : '本を追加';
  $('deleteBtn').classList.toggle('hidden', !editing);
  if(editing){
    $('bookId').value=editing.id;
    ['title','author','isbn','publisher','publishedDate','purchaseDate','price','format','location','status','startedDate','finishedDate','rating','notes'].forEach(k=>$(k).value=editing[k] ?? '');
    $('tags').value=(editing.tags||[]).join(', ');
  }
  dialog.showModal();
}
function closeDialog(){ dialog.close(); }

form.addEventListener('submit', (e)=>{
  e.preventDefault();
  const id=$('bookId').value || uid();
  const old=books.find(b=>b.id===id);
  const book={
    id,
    title:$('title').value.trim(), author:$('author').value.trim(), isbn:$('isbn').value.trim(), publisher:$('publisher').value.trim(),
    publishedDate:$('publishedDate').value, purchaseDate:$('purchaseDate').value, price:$('price').value ? Number($('price').value) : null,
    format:$('format').value, location:$('location').value.trim(), status:$('status').value, startedDate:$('startedDate').value,
    finishedDate:$('finishedDate').value, rating:Number($('rating').value),
    tags:$('tags').value.split(',').map(s=>s.trim()).filter(Boolean), notes:$('notes').value.trim(),
    createdAt: old?.createdAt || new Date().toISOString(), updatedAt:new Date().toISOString()
  };
  if(!book.title) return;
  const idx=books.findIndex(b=>b.id===id);
  if(idx>=0) books[idx]=book; else books.unshift(book);
  saveBooks(); closeDialog(); render();
});

$('deleteBtn').addEventListener('click',()=>{
  const id=$('bookId').value; const b=books.find(x=>x.id===id);
  if(b && confirm(`「${b.title}」を削除しますか？`)) { books=books.filter(x=>x.id!==id); saveBooks(); closeDialog(); render(); }
});
$('addBookBtn').addEventListener('click',()=>openDialog());
$('closeDialogBtn').addEventListener('click',closeDialog);
$('cancelBtn').addEventListener('click',closeDialog);
['searchInput','statusFilter','sortSelect'].forEach(id=>$(id).addEventListener('input',render));

$('exportBtn').addEventListener('click',()=>{
  const blob=new Blob([JSON.stringify({version:1,exportedAt:new Date().toISOString(),books},null,2)],{type:'application/json'});
  const url=URL.createObjectURL(blob); const a=document.createElement('a'); a.href=url; a.download=`my-bookshelf-${new Date().toISOString().slice(0,10)}.json`; a.click(); URL.revokeObjectURL(url);
});
$('importInput').addEventListener('change', async (e)=>{
  const file=e.target.files?.[0]; if(!file) return;
  try{
    const data=JSON.parse(await file.text()); const incoming=Array.isArray(data) ? data : data.books;
    if(!Array.isArray(incoming)) throw new Error();
    if(confirm(`現在の${books.length}冊を置き換えて、${incoming.length}冊を読み込みますか？`)){ books=incoming; saveBooks(); render(); }
  }catch{ alert('読み込みに失敗しました。書き出したJSONファイルを選択してください。'); }
  e.target.value='';
});

let deferredInstallPrompt = null;
const installBtn = $('installBtn');
const installNote = $('installNote');

function updateInstallUI(){
  const standalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
  if(standalone){
    installBtn.classList.add('hidden');
    installNote.classList.add('hidden');
    return;
  }
  if(location.protocol === 'file:'){
    installNote.innerHTML = '<strong>PWAインストール:</strong> この画面はローカルファイルとして動作中です。ホーム画面へアプリとして追加するには、HTTPSで公開した版をChromeで開いてください。';
    installNote.classList.remove('hidden');
  }
}

window.addEventListener('beforeinstallprompt', (e)=>{
  e.preventDefault();
  deferredInstallPrompt = e;
  installBtn.classList.remove('hidden');
  installNote.classList.add('hidden');
});

installBtn.addEventListener('click', async ()=>{
  if(!deferredInstallPrompt) return;
  deferredInstallPrompt.prompt();
  await deferredInstallPrompt.userChoice;
  deferredInstallPrompt = null;
  installBtn.classList.add('hidden');
});

window.addEventListener('appinstalled', ()=>{
  deferredInstallPrompt = null;
  installBtn.classList.add('hidden');
  installNote.classList.add('hidden');
});

if('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  window.addEventListener('load', ()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
}
updateInstallUI();
render();

</script>
</body>
</html>
