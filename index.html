<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#111827" />
  <meta name="description" content="自宅の蔵書と読書履歴を管理する個人用本棚アプリ" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="本棚" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="apple-touch-icon" href="./icons/icon-192.png" />
  <title>My Bookshelf</title>
    <link rel="stylesheet" href="./css/styles.css" />
</head>
<body>
  <header class="topbar">
    <div>
      <p class="eyebrow">Personal Library</p>
      <h1>My Bookshelf</h1>
      <p id="commitVersion" class="version-label">開発版（コミット情報なし）</p>
    </div>
    <button id="addBookBtn" class="primary">＋ 本を追加</button>
  </header>
  <div class="install-row"><button id="installBtn" class="ghost hidden">ホーム画面に追加</button></div>
  <div id="installNote" class="install-note hidden"></div>

  <main class="container">
    <section id="recoveryNotice" class="recovery-notice" role="alert" hidden>
      <strong>保存データを読み込めませんでした</strong>
      <p>本が消えたとは限りません。元の保存データを保護するため、追加・編集・通常の書き出しを停止しています。まず「元データを救出」で原文を保管してください。復元は「読み込み」から正常なバックアップJSONを選択します。</p>
      <button id="rescueBtn" class="ghost" type="button">元データを救出</button>
      <button id="retryBtn" class="ghost" type="button">再読み込みを試す</button>
    </section>
    <section class="stats" aria-label="蔵書サマリー">
      <article><span id="statTotal">0</span><small>蔵書</small></article>
      <article><span id="statUnread">0</span><small>未読</small></article>
      <article><span id="statReading">0</span><small>読書中</small></article>
      <article><span id="statFinished">0</span><small>今年読了</small></article>
    </section>

    <section class="toolbar">
      <input id="searchInput" type="search" aria-label="本を検索" placeholder="タイトル・著者・ISBN・タグで検索" />
      <select id="statusFilter" aria-label="読書状態で絞り込み">
        <option value="all">すべて</option>
        <option value="unread">未読</option>
        <option value="reading">読書中</option>
        <option value="finished">読了</option>
        <option value="paused">中断</option>
      </select>
      <select id="sortSelect" aria-label="並べ替え">
        <option value="updated_desc">更新順</option>
        <option value="title_asc">タイトル順</option>
        <option value="author_asc">著者順</option>
        <option value="finished_desc">読了日順</option>
      </select>
    </section>

    <section class="section-head">
      <h2>本棚</h2>
      <div class="actions-inline">
        <button id="exportBtn" class="ghost">書き出し</button>
        <label class="ghost file-label">読み込み<input id="importInput" type="file" accept="application/json" hidden /></label>
      </div>
    </section>

    <section id="bookGrid" class="book-grid" aria-live="polite"></section>
    <p id="emptyState" class="empty">本がまだありません。「本を追加」から登録してください。</p>
  </main>

  <dialog id="bookDialog">
    <form id="bookForm" method="dialog">
      <div class="dialog-head">
        <div>
          <p class="eyebrow">Book</p>
          <h2 id="dialogTitle">本を追加</h2>
        </div>
        <button type="button" id="closeDialogBtn" class="icon-btn" aria-label="閉じる">×</button>
      </div>

      <input id="bookId" type="hidden" />
      <div class="form-grid">
        <label>タイトル *<input id="title" required /></label>
        <label>著者<input id="author" /></label>
        <label>ISBN<input id="isbn" inputmode="numeric" /></label>
        <label>出版社<input id="publisher" /></label>
        <label>刊行日<input id="publishedDate" type="date" /></label>
        <label>購入日<input id="purchaseDate" type="date" /></label>
        <label>購入価格（円）<input id="price" type="number" min="0" step="1" /></label>
        <label>形式
          <select id="format"><option>紙</option><option>電子書籍</option><option>その他</option></select>
        </label>
        <label>保管場所<input id="location" placeholder="例：書斎・本棚A" /></label>
        <label>状態
          <select id="status"><option value="unread">未読</option><option value="reading">読書中</option><option value="finished">読了</option><option value="paused">中断</option></select>
        </label>
        <label>読書開始日<input id="startedDate" type="date" /></label>
        <label>読了日<input id="finishedDate" type="date" /></label>
        <label>評価
          <select id="rating"><option value="0">未評価</option><option value="1">★</option><option value="2">★★</option><option value="3">★★★</option><option value="4">★★★★</option><option value="5">★★★★★</option></select>
        </label>
        <label class="span-2">タグ<input id="tags" placeholder="小説, 歴史, 仕事 など（カンマ区切り）" /></label>
        <label class="span-2">感想・メモ<textarea id="notes" rows="5"></textarea></label>
      </div>

      <div class="dialog-actions">
        <button type="button" id="deleteBtn" class="danger hidden">削除</button>
        <div class="spacer"></div>
        <button type="button" id="cancelBtn" class="ghost">キャンセル</button>
        <button type="submit" class="primary">保存</button>
      </div>
    </form>
  </dialog>

  <template id="bookCardTemplate">
    <article class="book-card">
      <button class="card-hit" type="button" aria-label="書籍を編集"></button>
      <div class="cover" aria-hidden="true"><span>BOOK</span></div>
      <div class="book-info">
        <div class="status-row"><span class="status-badge"></span><span class="rating"></span></div>
        <h3 class="book-title"></h3>
        <p class="book-author"></p>
        <div class="tag-list"></div>
        <p class="book-meta"></p>
      </div>
    </article>
  </template>

  <script defer src="./js/validation.js"></script>
  <script defer src="./js/storage.js"></script>
  <script defer src="./js/version.js"></script>
  <script defer src="./js/app.js"></script>
  <script defer src="./js/pwa.js"></script>
</body>
</html>
